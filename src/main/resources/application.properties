# Spring Application Configuration
spring.application.name=spring-wallet-api

# Datasource configuration (H2 In-Memory Database)
spring.datasource.url=jdbc:h2:mem:walletdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console enablement for DB visualization
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Hibernate / JPA configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Custom JWT (JSON Web Token) Security configurations
# 256-bit Hexadecimal Key for Signature validation
jwt.secret=9a4f2c8d3e7b1a5c6d8e2f0a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c
jwt.expiration=86400000

